<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#241a33" />

    <!-- Restauration du chemin après le fallback 404.html (BrowserRouter sur
         GitHub Pages). N'agit QUE si l'URL contient le motif « /?/… » ; sinon
         no-op (donc inoffensif en mode HashRouter). Doit s'exécuter avant l'app. -->
    <script>
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- SEO -->
    <meta name="description" content="IslamHub : hadiths authentiques, douaas, dhikrs, versets du Coran avec traduction française, paroles de savants, horaires de prière et vidéos islamiques." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IslamHub" />
    <meta property="og:title" content="IslamHub - Votre source de savoir islamique" />
    <meta property="og:description" content="Hadiths authentiques, douaas, dhikrs, versets du Coran avec traduction française, paroles de savants et horaires de prière." />
    <meta property="og:locale" content="fr_FR" />
    <!-- URL absolue requise pour og:image : à mettre à jour lors du passage au vrai domaine -->
    <meta property="og:image" content="https://sou55i.github.io/IslamHub_front/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Security headers (en prod, préférer de vrais headers HTTP côté hébergeur) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https: wss: http://localhost:* ws://localhost:*; img-src 'self' data: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Applique le thème sombre avant le premier rendu (anti-flash blanc).
         Fichier externe plutôt qu'inline pour rester compatible avec script-src 'self'. -->
    <script src="./theme-init.js"></script>

    <title>IslamHub - Hadiths, Coran, Douaas et savoir islamique</title>

    <!-- Données structurées globales (Organization + WebSite). Mettre à jour
         "url" lors du passage à un vrai domaine. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "IslamHub",
          "url": "https://sou55i.github.io/IslamHub_front/",
          "logo": "https://sou55i.github.io/IslamHub_front/pwa-512x512.png"
        },
        {
          "@type": "WebSite",
          "name": "IslamHub",
          "url": "https://sou55i.github.io/IslamHub_front/",
          "inLanguage": "fr-FR"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>

    <!-- Analytics : si tu actives Cloudflare Web Analytics, ré-ajoute ici le
         <script> beacon avec ton vrai token, et remets
         https://static.cloudflareinsights.com dans script-src de la CSP. -->
  </body>
</html>
