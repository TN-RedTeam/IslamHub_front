name: Déploiement GitHub Pages

# Build + déploiement automatique du site à chaque push sur `main`.
# (Déclenchable aussi à la main via l'onglet Actions → « Run workflow ».)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits nécessaires au déploiement Pages via l'API officielle.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on annule un run en cours si un nouveau arrive.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Récupérer le code (main)
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le sitemap multilingue (depuis la base, publié uniquement)
        run: npm run gen:sitemap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Compiler le site principal (racine)
        run: npm run build
        # Les clés Supabase sont injectées au build depuis les secrets du dépôt
        # (Settings → Secrets and variables → Actions). Sans elles, le site
        # déployé n'aurait pas d'accès à la base.
        #
        # Site principal servi sur https://<user>.github.io/IslamHub_front/ :
        # BrowserRouter (URLs propres indexables) + base absolue + 404.html.
        env:
          VITE_ROUTER: browser
          VITE_BASE: /IslamHub_front/

      # Cache du binaire Chromium de Playwright : évite de le re-télécharger
      # (~130 Mo) à chaque run. Clé liée à la version de Playwright (package-lock).
      - name: Cache des navigateurs Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium (prérendu SSG)
        run: npx playwright install --with-deps chromium

      - name: Prérendu SSG par langue (coquille + fiches publiées)
        run: npm run prerender
        env:
          VITE_BASE: /IslamHub_front/
          SITE_ORIGIN: https://tn-redteam.github.io/IslamHub_front
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
